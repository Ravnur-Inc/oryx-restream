site_name: Ravnur Simulcast Manager
site_description: Operator guide for the Ravnur Simulcast Manager — ingest one live stream and restream it to multiple destinations.
site_url: https://ravnur-inc.github.io/oryx-restream/
repo_url: https://github.com/Ravnur-Inc/oryx-restream
repo_name: Ravnur-Inc/oryx-restream
edit_uri: edit/main/docs-site/
docs_dir: docs-site
copyright: © Ravnur Inc.

theme:
  name: material
  font:
    text: Public Sans
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts: concepts.md
  - Channels: channels.md
  - Destinations: destinations.md
  - Ingest: ingest.md
  - Monitor: monitor.md
  - Users & invites: users.md
  - System health: system.md
  - Encoder settings: encoder-settings.md
  - Troubleshooting: troubleshooting.md
  - Glossary: glossary.md
  - Administration: administration.md
