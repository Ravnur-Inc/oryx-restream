name: Publish image to GHCR

# Build and publish the restreamer image to GitHub Container Registry.
#   - on a version tag (e.g. `git tag v1.0.0 && git push origin v1.0.0`)
#   - or manually from the Actions tab (workflow_dispatch)
# Uses the built-in GITHUB_TOKEN — no extra secrets to configure.
# Image: ghcr.io/ravnur-inc/oryx-restream
#
# Note: the first publish creates a PRIVATE package. To allow anonymous
# `docker pull`, set the package to Public once under the org's Packages
# settings (Packages -> oryx-restream -> Package settings -> Change visibility).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ravnur-inc/oryx-restream
          # v1.2.3 -> tags 1.2.3, 1.2, and latest. Manual runs push latest only.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # amd64 only: the image compiles SRS/Go/UI from source, so cross-building
      # arm64 under QEMU is slow/fragile, and the deploy target (Azure VM) is
      # amd64. Add linux/arm64 to `platforms` later if an arm64 image is needed.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
