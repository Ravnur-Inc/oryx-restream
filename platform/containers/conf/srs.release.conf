# !!! Important: SRS will restore this file during each restart, please never modify it.

# The config for LigthHouse SRS.
# See https://github.com/ossrs/srs/blob/develop/trunk/conf/full.conf

listen              1935;
max_connections     1000;
# For docker, please use docker logs to manage the logs of SRS.
# See https://docs.docker.com/config/containers/logging/
srs_log_tank        console;
daemon              on;
disable_daemon_for_docker off;
http_api {
    enabled         on;
    listen          127.0.0.1:1985;
    raw_api {
        enabled on;
        allow_reload on;
    }
}
http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}
rtc_server {
    enabled on;
    listen 8000; # UDP port
    # @see https://github.com/ossrs/srs/wiki/v4_CN_WebRTC#config-candidate
    candidate $CANDIDATE;
    # Disable for Oryx.
    use_auto_detect_network_ip off;
    api_as_candidates off;
}

# See https://github.com/ossrs/srs/issues/1147
srt_server {
    enabled on;
    listen 10080; # UDP port
    maxbw 1000000000;
    connect_timeout 4000;
    # Standard SRT live mode for real-world (lossy/internet) ingest. TSBPD must
    # be ON so retransmitted/out-of-order packets are reordered+de-duped before
    # the TS demux; with it OFF (the upstream LAN "high-quality" preset) any loss
    # causes "drop PES for duplicated cc" -> macroblocking / overlapping frames.
    # See https://ossrs.io/lts/en-us/docs/v6/doc/srt
    latency 200;
    peerlatency 200;
    recvlatency 200;
    tlpktdrop on;
    tsbpdmode on;
}

include containers/data/config/srs.server.conf;

vhost __defaultVhost__ {
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }
    rtc {
        enabled     on;
        nack on;
        twcc on;
        stun_timeout 30;
        dtls_role passive;
        # @see https://github.com/ossrs/srs/wiki/v4_CN_WebRTC#rtmp-to-rtc
        rtmp_to_rtc on;
        keep_bframe off;
        # @see https://github.com/ossrs/srs/wiki/v4_CN_WebRTC#rtc-to-rtmp
        rtc_to_rtmp on;
        pli_for_rtmp 6.0;
    }
    srt {
        enabled     on;
        srt_to_rtmp on;
    }

    # Delivery to local readers (the FFmpeg forward tasks, and the Monitor player).
    play {
        # time_jitter MUST NOT be left at the SRS default of "full". In "full" mode
        # SRS rewrites playback timestamps and recalibrates gaps it considers large
        # to a fixed 40ms (25fps). We are a pass-through restreamer: the forward
        # FFmpeg is an RTMP *player*, so it receives the rewritten timestamps, not
        # the encoder's. On a 60fps ingest that rewrite made media time advance ~2x
        # wall clock — FFmpeg reported speed=2.0x, the abnormal-speed watchdog
        # restarted the task every ~20s, and YouTube saw a framerate well above the
        # encoder's. Diagnosed 2026-08-17 with a known-good synthetic 1080p60 SRT
        # source, which reproduced it with the encoder out of the picture entirely.
        #
        # "zero" keeps the stream starting at zero (RTMP/YouTube expect that) but
        # skips the recalibration, so the encoder's own timing is passed through
        # intact — which is the only correct behaviour for a "-c copy" restreamer.
        time_jitter       zero;
    }

    # For backend server to verify client.
    http_hooks {
        enabled         on;
        on_publish      http://localhost:2022/terraform/v1/hooks/srs/verify;
        on_unpublish    http://localhost:2022/terraform/v1/hooks/srs/verify;
        on_play         http://localhost:2022/terraform/v1/hooks/srs/verify;
        on_stop         http://localhost:2022/terraform/v1/hooks/srs/verify;
        on_hls          http://localhost:2022/terraform/v1/hooks/srs/hls;
    }

    include containers/data/config/srs.vhost.conf;
}

